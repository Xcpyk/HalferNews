<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软件成本计算器 - 半闻驿</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/static/logo.jpg">
    <style>
        @font-face {
            font-family: 'AlibabaPuHuiTi-Regular';
            src: url('/static/AlibabaPuHuiTi-2-55-Regular.ttf') format('truetype');
            font-style: normal;
            unicode-range: U+0000-FFFF;
        }
        @font-face {
            font-family: 'AlibabaPuHuiTi-Bold';
            src: url('/static/AlibabaPuHuiTi-2-85-Bold.ttf') format('truetype');
            font-style: normal;
            unicode-range: U+0000-FFFF;
        }
        @font-face {
            font-family: 'AlibabaPuHuiTi-Light';
            src: url('/static/AlibabaPuHuiTi-2-45-Thin.ttf') format('truetype');
            font-style: normal;
            unicode-range: U+0000-FFFF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000000;
            font-family: 'AlibabaPuHuiTi-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        /* 顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }
        
        .logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .brand-name {
            font-family: 'AlibabaPuHuiTi-Bold', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
        }
        
        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-decoration: none;
        }
        
        .btn-primary {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }
        
        .btn-primary:hover {
            background: #f5f5f5;
            color: #000000;
            text-decoration: none;
        }
        
        /* 主内容区域 */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 64px 24px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .calculator-header {
            text-align: center;
            margin-bottom: 48px;
            padding: 48px 0;
        }
        
        .calculator-title {
            font-family: 'AlibabaPuHuiTi-Bold', sans-serif;
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        
        .calculator-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 32px;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-decoration: none;
            transform: translateY(-2px);
        }
        
        /* 表单区域 */
        .form-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px 24px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .form-section:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .form-section:hover::before {
            opacity: 1;
        }
        
        .form-section h3 {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 24px;
            font-size: 20px;
            font-family: 'AlibabaPuHuiTi-Bold', sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            outline: none;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-select option {
            background: #000000;
            color: #ffffff;
        }
        
        .form-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 4px;
        }
        
        .btn-calculate {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'AlibabaPuHuiTi-Bold', sans-serif;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-calculate:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
        }
        
        /* 结果区域 */
        .results-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px 24px;
            margin-top: 32px;
            display: none;
            animation: fadeInUp 0.5s ease;
        }
        
        .results-section.show {
            display: block;
        }
        
        .results-section h3 {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 24px;
            font-size: 20px;
            font-family: 'AlibabaPuHuiTi-Bold', sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .result-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        
        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .result-label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .result-value {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            font-family: 'AlibabaPuHuiTi-Bold', sans-serif;
        }
        
        .complexity-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .complexity-low { 
            background: rgba(34, 197, 94, 0.2); 
            color: #22c55e; 
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .complexity-medium { 
            background: rgba(245, 158, 11, 0.2); 
            color: #f59e0b; 
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .complexity-high { 
            background: rgba(239, 68, 68, 0.2); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        /* 装饰性元素 */
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.01) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 16px;
                height: 56px;
            }
            
            .main-container {
                padding: 56px 16px 16px;
            }
            
            .calculator-title {
                font-size: 32px;
            }
            
            .calculator-subtitle {
                font-size: 16px;
            }
            
            .form-section {
                padding: 24px 20px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 13px;
                min-height: 32px;
            }
        }
        
        @media (max-width: 480px) {
            .calculator-title {
                font-size: 28px;
            }
            
            .calculator-subtitle {
                font-size: 14px;
            }
            
            .form-section {
                padding: 20px 16px;
            }
            
            .form-section h3 {
                font-size: 18px;
            }
            
            .result-value {
                font-size: 20px;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="background-pattern"></div>
    
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/logo.jpg" alt="半闻驿" class="logo">
            <span class="brand-name">半闻驿</span>
        </a>
        
        <div class="navbar-actions">
            <a href="/" class="btn btn-secondary">返回门户</a>
            <a href="/news" class="btn btn-primary">新闻中心</a>
        </div>
    </nav>
    
    <!-- 主内容区域 -->
    <main class="main-container">
        <section class="calculator-header">
            <h1 class="calculator-title">软件成本计算器</h1>
            <p class="calculator-subtitle">基于2024年中国软件行业基准数据的专业计算工具，精准评估项目成本</p>
        </section>
        
        <a href="/" class="back-btn">
            ← 返回门户
        </a>
        
        <form id="costCalculator">
            <!-- 项目基本信息 -->
            <div class="form-section">
                <h3>
                    <img src="/static/iconfont/book-fill.svg" width="20" height="20" style="margin-right: 8px; filter: invert(1);" alt="项目信息">
                    项目基本信息
                </h3>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">项目名称</label>
                            <input type="text" class="form-control" id="projectName" placeholder="请输入项目名称" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">项目类型</label>
                            <select class="form-select" id="projectType" required>
                                <option value="">请选择项目类型</option>
                                <option value="web">Web应用系统</option>
                                <option value="mobile">移动应用</option>
                                <option value="desktop">桌面应用</option>
                                <option value="api">API服务</option>
                                <option value="ai">AI/机器学习</option>
                                <option value="game">游戏开发</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 功能复杂度评估 -->
            <div class="form-section">
                <h3>
                    <img src="/static/iconfont/Function.svg" width="20" height="20" style="margin-right: 8px; filter: invert(1);" alt="功能评估">
                    功能复杂度评估
                </h3>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label">用户管理功能</label>
                            <select class="form-select" id="userManagement">
                                <option value="1">基础用户管理</option>
                                <option value="2">角色权限管理</option>
                                <option value="3">多租户系统</option>
                                <option value="4">企业级SSO</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label">数据处理复杂度</label>
                            <select class="form-select" id="dataComplexity">
                                <option value="1">简单CRUD操作</option>
                                <option value="2">复杂查询统计</option>
                                <option value="3">大数据处理</option>
                                <option value="4">实时流处理</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label">集成复杂度</label>
                            <select class="form-select" id="integrationComplexity">
                                <option value="1">无外部集成</option>
                                <option value="2">API集成</option>
                                <option value="3">多系统集成</option>
                                <option value="4">复杂业务流程集成</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 开发规模 -->
            <div class="form-section">
                <h3>
                    <img src="/static/iconfont/bar chart.svg" width="20" height="20" style="margin-right: 8px; filter: invert(1);" alt="开发规模">
                    开发规模
                </h3>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">预计功能点数量</label>
                            <input type="number" class="form-control" id="functionPoints" placeholder="如：500" min="1" required>
                            <small class="form-text">1个功能点 ≈ 8-10人天工作量</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">开发团队规模</label>
                            <select class="form-select" id="teamSize" required>
                                <option value="">请选择团队规模</option>
                                <option value="1">1-3人</option>
                                <option value="2">4-6人</option>
                                <option value="3">7-10人</option>
                                <option value="4">11-20人</option>
                                <option value="5">20人以上</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 技术栈 -->
            <div class="form-section">
                <h3>
                    <img src="/static/iconfont/database-fill.svg" width="20" height="20" style="margin-right: 8px; filter: invert(1);" alt="技术栈">
                    技术栈选择
                </h3>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label">前端技术</label>
                            <select class="form-select" id="frontendTech">
                                <option value="1">传统HTML/CSS/JS</option>
                                <option value="2">Vue.js/React</option>
                                <option value="3">Angular/Next.js</option>
                                <option value="4">Flutter/React Native</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label">后端技术</label>
                            <select class="form-select" id="backendTech">
                                <option value="1">PHP/ASP.NET</option>
                                <option value="2">Java/Spring</option>
                                <option value="3">Python/Django/Flask</option>
                                <option value="4">Go/Node.js</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label">数据库类型</label>
                            <select class="form-select" id="databaseType">
                                <option value="1">MySQL/PostgreSQL</option>
                                <option value="2">MongoDB/Redis</option>
                                <option value="3">Oracle/SQL Server</option>
                                <option value="4">分布式数据库</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 质量要求 -->
            <div class="form-section">
                <h3>
                    <img src="/static/iconfont/pie chart.svg" width="20" height="20" style="margin-right: 8px; filter: invert(1);" alt="质量要求">
                    质量要求
                </h3>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">测试覆盖率要求</label>
                            <select class="form-select" id="testCoverage">
                                <option value="1">基础功能测试</option>
                                <option value="2">单元测试+集成测试</option>
                                <option value="3">自动化测试+性能测试</option>
                                <option value="4">全流程测试+安全测试</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">性能要求</label>
                            <select class="form-select" id="performanceRequirement">
                                <option value="1">基础性能</option>
                                <option value="2">中等性能</option>
                                <option value="3">高性能</option>
                                <option value="4">企业级性能</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn-calculate">
                🧮 计算项目成本
            </button>
        </form>
        
        <!-- 计算结果 -->
        <div class="results-section" id="resultsSection">
            <h3>📈 成本分析结果</h3>
            <div class="row">
                <div class="col-md-6">
                    <div class="result-item">
                        <div class="result-label">项目复杂度评级</div>
                        <div class="result-value" id="complexityLevel">-</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="result-item">
                        <div class="result-label">预计开发周期</div>
                        <div class="result-value" id="developmentTime">-</div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="result-item">
                        <div class="result-label">人力成本</div>
                        <div class="result-value" id="laborCost">-</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="result-item">
                        <div class="result-label">技术成本</div>
                        <div class="result-value" id="techCost">-</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="result-item">
                        <div class="result-label">总成本</div>
                        <div class="result-value" id="totalCost">-</div>
                    </div>
                </div>
            </div>
            
            <div class="result-item">
                <div class="result-label">成本明细说明</div>
                <div id="costBreakdown" style="color: rgba(255, 255, 255, 0.7); font-size: 14px; line-height: 1.6;">
                    -
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('costCalculator').addEventListener('submit', function(e) {
            e.preventDefault();
            calculateCost();
        });

        function calculateCost() {
            // 获取表单数据
            const projectName = document.getElementById('projectName').value;
            const projectType = document.getElementById('projectType').value;
            const userManagement = parseInt(document.getElementById('userManagement').value);
            const dataComplexity = parseInt(document.getElementById('dataComplexity').value);
            const integrationComplexity = parseInt(document.getElementById('integrationComplexity').value);
            const functionPoints = parseInt(document.getElementById('functionPoints').value);
            const teamSize = parseInt(document.getElementById('teamSize').value);
            const frontendTech = parseInt(document.getElementById('frontendTech').value);
            const backendTech = parseInt(document.getElementById('backendTech').value);
            const databaseType = parseInt(document.getElementById('databaseType').value);
            const testCoverage = parseInt(document.getElementById('testCoverage').value);
            const performanceRequirement = parseInt(document.getElementById('performanceRequirement').value);

            // 计算复杂度系数
            const complexityScore = (userManagement + dataComplexity + integrationComplexity + 
                                   frontendTech + backendTech + databaseType + 
                                   testCoverage + performanceRequirement) / 8;
            
            // 确定复杂度等级
            let complexityLevel, complexityClass;
            if (complexityScore <= 1.5) {
                complexityLevel = "低复杂度";
                complexityClass = "complexity-low";
            } else if (complexityScore <= 2.5) {
                complexityLevel = "中复杂度";
                complexityClass = "complexity-medium";
            } else {
                complexityLevel = "高复杂度";
                complexityClass = "complexity-high";
            }

            // 基于2024年基准数据计算成本
            // 假设：1功能点 = 8-10人天，根据复杂度调整
            const baseDaysPerFP = 8 + (complexityScore - 1) * 2; // 复杂度越高，人天越多
            const totalWorkDays = functionPoints * baseDaysPerFP;
            
            // 团队效率系数（团队越大，效率相对降低）
            const teamEfficiency = 1 + (teamSize - 1) * 0.1;
            const adjustedWorkDays = totalWorkDays * teamEfficiency;
            
            // 开发周期（月）
            const developmentMonths = Math.ceil(adjustedWorkDays / (22 * teamSize));
            
            // 人力成本计算（基于2024年软件行业薪资基准）
            const avgDailyRate = 800 + (complexityScore - 1) * 200; // 复杂度越高，日薪越高
            const laborCost = adjustedWorkDays * avgDailyRate;
            
            // 技术成本（基础设施、工具、许可证等）
            const techCost = laborCost * 0.15; // 人力成本的15%
            
            // 总成本
            const totalCost = laborCost + techCost;
            
            // 显示结果
            document.getElementById('complexityLevel').innerHTML = 
                `<span class="complexity-badge ${complexityClass}">${complexityLevel}</span>`;
            document.getElementById('developmentTime').textContent = `${developmentMonths} 个月`;
            document.getElementById('laborCost').textContent = `¥${laborCost.toLocaleString()}`;
            document.getElementById('techCost').textContent = `¥${techCost.toLocaleString()}`;
            document.getElementById('totalCost').textContent = `¥${totalCost.toLocaleString()}`;
            
            // 成本明细说明
            const breakdown = `
                <strong>项目名称：</strong>${projectName}<br>
                <strong>项目类型：</strong>${document.getElementById('projectType').options[document.getElementById('projectType').selectedIndex].text}<br>
                <strong>功能点数量：</strong>${functionPoints} FP<br>
                <strong>预计工作量：</strong>${adjustedWorkDays.toFixed(0)} 人天<br>
                <strong>团队规模：</strong>${document.getElementById('teamSize').options[document.getElementById('teamSize').selectedIndex].text}<br>
                <strong>复杂度系数：</strong>${complexityScore.toFixed(2)}<br>
                <strong>日薪基准：</strong>¥${avgDailyRate}/人天<br>
                <strong>计算依据：</strong>基于2024年中国软件行业基准数据，结合项目复杂度、团队规模等因素综合评估
            `;
            document.getElementById('costBreakdown').innerHTML = breakdown;
            
            // 显示结果区域
            document.getElementById('resultsSection').classList.add('show');
            
            // 滚动到结果区域
            document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
